services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kitchen_table
      POSTGRES_USER: kitchen_table
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen_table -d kitchen_table"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
