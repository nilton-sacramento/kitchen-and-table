name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'feature/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 17 e JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da alteracao
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Selecionar codigo a validar
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
          else
            implementation='245f7378e9db05712750100d6d806a648501c6ae'
            if git cat-file -e "${implementation}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$implementation" HEAD; then
              echo '::error::O backend ja foi integrado e pom.xml foi removido. Bootstrap proibido.'
              exit 1
            fi
            if ! git merge-base --is-ancestor ba275cd3b08b4e56c5b59628935b74378de8985d HEAD; then
              echo '::error::Base inesperada; revisar antes de executar o bootstrap.'
              exit 1
            fi
            echo 'Bootstrap explicito: esta branch de configuracao ainda nao contem o backend.'
            echo 'Validando o commit fixo 04b136c da Etapa 1, sem merge ou copia para a branch.'
            echo 'directory=_ci/etapa-1' >> "$GITHUB_OUTPUT"
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout isolado da Etapa 1 durante bootstrap
        if: steps.source.outputs.bootstrap == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nilton-sacramento/kitchen-and-table
          ref: 04b136c604a9f7a5ce9fb6fb9973aaea910ade99
          path: _ci/etapa-1
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ steps.source.outputs.directory }}/pom.xml

      - name: Node para verificar JavaScript
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Sintaxe JavaScript
        working-directory: ${{ steps.source.outputs.directory }}
        run: node --check src/main/resources/static/assets/app.js

      - name: Compilacao, testes e empacotamento
        working-directory: ${{ steps.source.outputs.directory }}
        run: mvn --batch-mode --no-transfer-progress -Ddebug=false -Dlogging.level.org.springframework=INFO verify

      - name: Registrar escopo validado
        if: success()
        shell: bash
        env:
          SOURCE_DIRECTORY: ${{ steps.source.outputs.directory }}
          BOOTSTRAP: ${{ steps.source.outputs.bootstrap }}
        run: |
          {
            echo '## CI: Java 17 e JavaScript'
            echo "Bootstrap: ${BOOTSTRAP}"
            echo "Diretorio validado: ${SOURCE_DIRECTORY}"
            echo 'JavaScript verificado; Maven verify executado sem desativar testes.'
            echo 'Sem banco externo: os testes usam mocks; Tomcat temporario apenas em loopback.'
          } >> "$GITHUB_STEP_SUMMARY"
